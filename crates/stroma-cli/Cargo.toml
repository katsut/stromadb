[package]
name = "stromadb"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
readme.workspace = true
keywords = ["graph", "database", "cli", "knowledge-graph", "graphrag"]
categories = ["command-line-utilities", "database"]
description = "StromaDB command-line interface (`stroma` binary): init, ingest, embed, query, stats, serve, up."

[[bin]]
name = "stroma"
path = "src/main.rs"

[dependencies]
stromadb-store = { path = "../stroma-db", version = "0.3.0" }
stromadb-serve = { path = "../stroma-serve", version = "0.3.0" }
serde_json = "1"
